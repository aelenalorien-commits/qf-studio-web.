<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | QF studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .btn-return {
            background-color: #FFFFFF !important;
            color: #111111 !important;
            border: 1px solid #F4A6C1 !important;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-return:hover {
            background-color: #F4A6C1 !important;
            color: #111111 !important;
        }
    </style>
</head>
<body>

    <!-- NAVEGACIÓN SUPERIOR (Oscura) -->
    <header class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">QF <span>studio</span></a>
            <div class="nav-actions">
                <a href="index.html" class="btn-outline" style="text-decoration:none;">Catálogo</a>
            </div>
        </div>
    </header>

    <!-- CARRITO (Fondo Blanco) -->
    <main class="container" style="padding: 120px 0 60px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px;">
            <h2 style="font-weight: 400; font-size: 28px;">Tu Carrito</h2>
            <a href="index.html" class="btn-return">
                ← Seguir Comprando
            </a>
        </div>
        
        <div style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px; align-items: start;" class="cart-layout">
            
            <!-- LISTA -->
            <div style="background: var(--bg-gray); border: 1px solid var(--border-light); padding: 25px; border-radius: 14px;">
                <h3 style="font-weight: 400; font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid var(--border-light); padding-bottom: 10px;">Prendas en Carrito</h3>
                <div id="cart-items-container"></div>
                <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 15px; color: var(--text-muted);">Total:</span>
                    <strong id="cart-total-amount" style="font-size: 20px; font-weight: 500;">0 Bs</strong>
                </div>
            </div>

            <!-- PAGO Y ENVÍO -->
            <div style="background: var(--bg-light); border: 1px solid var(--border-light); padding: 25px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.03);">
                <h3 style="font-weight: 400; font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid var(--border-light); padding-bottom: 10px;">Pago y Envío</h3>
                
                <label><strong>1. Método de Envío:</strong></label>
                <select id="shipping-method" onchange="updateCartShippingUI()">
                    <option value="yango">Envío Local (Yango)</option>
                    <option value="punto">Recojo en Local</option>
                    <option value="nacional">Envío Nacional / Provincia</option>
                </select>

                <div id="shipping-details-box" class="shipping-box" style="margin-top: 15px;"></div>

                <div class="qr-payment-box" style="margin-top: 20px;">
                    <label><strong>2. Pago por Código QR:</strong></label>
                    <p class="small-note" style="color:var(--text-muted); font-size:12px; margin-bottom:8px;">Escanea el QR para cancelar el monto total:</p>
                    <div class="qr-container" style="text-align:center; background:var(--bg-gray); padding:15px; border-radius:8px; border:1px solid var(--border-light);">
                        <img src="img/qr.jpeg" alt="QR QF studio" style="width: 150px; height: 150px; object-fit: contain;">
                        <span style="display:block; font-size:12px; margin-top:5px; color:var(--text-muted);">QF studio • Bolivia</span>
                    </div>

                    <label style="margin-top: 15px; text-align: left;"><strong>Nro. de Comprobante / Transacción:</strong></label>
                    <input type="text" id="payment-proof" placeholder="Ej. Transacción #489210" required>
                </div>

                <button class="btn-primary full-width" style="margin-top: 20px; background-color: var(--text-dark); color: var(--bg-light);" onclick="checkoutCartAndSendWhatsApp()">
                    Validar Pago y Enviar Pedido
                </button>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <p>QF studio • Tienda Virtual • Santa Cruz, Bolivia</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderCartPage();
            updateCartShippingUI();
        });
    </script>
</body>
</html>
